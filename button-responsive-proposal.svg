<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720">
<rect width="1100" height="720" fill="#ecece8"/>
<g font-family="Microsoft YaHei, PingFang SC, sans-serif">
<text x="52" y="63" font-size="27" font-weight="700" fill="#2d3234">首页按钮 · 桌面与手机适配提案</text>
<text x="54" y="95" font-size="15" fill="#707777">同一设计语言，按卡片实际宽度调整 · 两组均按 1.5 倍展示</text>
<rect x="44" y="125" width="1012" height="515" rx="24" fill="#fafaf7"/>
<text x="90" y="172" font-size="19" font-weight="700" fill="#303537">桌面 · 紧凑卡片</text><text x="90" y="201" font-size="14" fill="#777d7d">按钮约 149 × 48px · 文字 14px</text>
<text x="545" y="172" font-size="19" font-weight="700" fill="#303537">手机 · 宽卡片</text><text x="545" y="201" font-size="14" fill="#777d7d">按钮约 265 × 64px · 文字 20px</text>
<!-- Both rendered at 1.5x; keep button labels centered and badges at leading edge -->
<g transform="translate(90 237) scale(1.5)"><rect x="0" y="0" width="189" height="220" rx="24" fill="#f1f1ee"/><rect x="20" y="52" width="149" height="48" rx="24" fill="#41454a"/><rect x="20" y="110" width="149" height="48" rx="24" fill="#e3e4e0" stroke="#c9cac7"/><circle cx="39" cy="76" r="11" fill="#62676a"/><circle cx="39" cy="134" r="11" fill="#cdd1cc"/><g fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M35 76h8m-4-4v8" stroke="#f5f5f2"/><path d="M35 134h8m-3-3 3 3-3 3" stroke="#41484a"/></g><g text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" letter-spacing=".5"><text x="94.5" y="76" fill="#f5f5f2">创建房间</text><text x="94.5" y="134" fill="#303638">加入房间</text></g></g>
<g transform="translate(545 237) scale(1.5)"><rect width="305" height="220" rx="24" fill="#f1f1ee"/><rect x="20" y="35" width="265" height="64" rx="32" fill="#41454a"/><rect x="20" y="111" width="265" height="64" rx="32" fill="#e3e4e0" stroke="#c9cac7"/><circle cx="52" cy="67" r="18" fill="#62676a"/><circle cx="52" cy="143" r="18" fill="#cdd1cc"/><g fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M46 67h12m-6-6v12" stroke="#f5f5f2"/><path d="M46 143h12m-5-5 5 5-5 5" stroke="#41484a"/></g><g text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="600" letter-spacing="1"><text x="152.5" y="67" fill="#f5f5f2">创建房间</text><text x="152.5" y="143" fill="#303638">加入房间</text></g></g>
<text x="53" y="686" font-size="13" fill="#747b7b">设计示意：手机卡片高度仅用于展示按钮；不同设备上的字体渲染会有差异。</text>
</g></svg>

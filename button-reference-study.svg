<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="800" viewBox="0 0 1100 800">
<rect width="1100" height="800" fill="#ecece8"/>
<g font-family="Microsoft YaHei, PingFang SC, sans-serif">
<text x="52" y="64" font-size="27" font-weight="700" fill="#2c3133">首页按钮 · 按真实卡片比例比较</text>
<text x="54" y="96" font-size="15" fill="#6e7575">按桌面约 149px、手机约 265px 的按钮宽度示意；为便于比较，高度统一为 48px。</text>
<rect x="44" y="126" width="1012" height="282" rx="24" fill="#fafaf7"/><rect x="44" y="428" width="1012" height="282" rx="24" fill="#fafaf7"/>
<text x="76" y="168" font-size="19" font-weight="700" fill="#303537">A · 圆点靠左，文字独立居中</text>
<text x="76" y="194" font-size="14" fill="#737a79">保留选中的图标位置；缩小图标、收紧字距，给文字更多呼吸空间。</text>
<text x="76" y="470" font-size="19" font-weight="700" fill="#303537">B · 图标与文字靠近，整体居中</text>
<text x="76" y="496" font-size="14" fill="#737a79">参考产品按钮的组合方式；减少图标存在感，让图标和文字作为一个整体。</text>
<!-- Panels use 1.5x dimensions -->
<g transform="translate(70 215)"><rect width="285" height="160" rx="24" fill="#f1f1ee"/><g transform="translate(30 12)"><rect width="225" height="72" rx="36" fill="#41454a"/><circle cx="25" cy="36" r="14" fill="#62676a"/><path d="M20 36h10m-5-5v10" fill="none" stroke="#f4f4f1" stroke-width="2" stroke-linecap="round"/><text x="112.5" y="36" text-anchor="middle" dominant-baseline="central" font-size="21" font-weight="600" letter-spacing=".75" fill="#f4f4f1">创建房间</text><rect y="84" width="225" height="72" rx="36" fill="#e3e4e0"/><circle cx="25" cy="120" r="14" fill="#cdd1cc"/><path d="M20 120h10m-4-4 4 4-4 4" fill="none" stroke="#41484a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="112.5" y="120" text-anchor="middle" dominant-baseline="central" font-size="21" font-weight="600" letter-spacing=".75" fill="#303638">加入房间</text></g></g>

# 可选候选覆盖文件；本轮未在生产启用。仍需独立验证Caddy、代理peer与备份。
services:
  accounts:
    profiles: [accounts]
    image: xdstar-accounts:${XDSTAR_ACCOUNT_RELEASE:?Set account release in server environment}
    build:
      context: ./accounts
      args:
        NODE_IMAGE: ${HAKISUB_NODE_IMAGE:-node:22-bookworm-slim}
    ports: ["127.0.0.1:18788:8790"]
    env_file:
      - path: ./secrets/accounts.env
        format: raw
    environment:
      XDSTAR_ACCOUNT_HOST: 0.0.0.0
      XDSTAR_ACCOUNT_PORT: "8790"
      XDSTAR_ACCOUNT_DATABASE: /app/data/accounts.sqlite
      XDSTAR_ACCOUNT_ORIGIN: https://xdstar.work
      XDSTAR_HAKISUB_ORIGIN: https://hakisub.xdstar.work
      NODE_OPTIONS: --max-old-space-size=192
    volumes: [xdstar_account_data:/app/data]
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    restart: unless-stopped
    mem_limit: 384m
    memswap_limit: 384m
    cpus: 0.5
    pids_limit: 64
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8790/api/account/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  xdstar_account_data:

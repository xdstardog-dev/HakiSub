name: hakisub-test
services:
  hakisub:
    image: hakisub-test:${HAKISUB_RELEASE:?Set HAKISUB_RELEASE in .env}
    build:
      context: .
      args:
        NODE_IMAGE: ${HAKISUB_NODE_IMAGE:-node:22-bookworm-slim}
    ports:
      - "127.0.0.1:18787:8787"
    env_file:
      - path: ./secrets/server.env
        format: raw
    environment:
      HAKISUB_DEPLOYMENT_MODE: private-test
      HAKISUB_HOST: 0.0.0.0
      HAKISUB_PORT: "8787"
      HAKISUB_ALLOWED_ORIGINS: http://localhost:18787,http://127.0.0.1:18787
      HAKISUB_MAX_ASR_SESSIONS: ${HAKISUB_MAX_ASR_SESSIONS:-2}
      HAKISUB_ASR_DEBUG: "0"
      NODE_OPTIONS: --max-old-space-size=256
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    mem_reservation: 128m
    memswap_limit: 512m
    cpus: 0.75
    pids_limit: 64
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/asr/health',{signal:AbortSignal.timeout(3000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>HakiSub · 八人提示音试听</title><style>
*{box-sizing:border-box}body{margin:0;background:#62666b;color:#f1f1ee;font:16px system-ui,sans-serif}main{max-width:850px;margin:auto;background:#41454a;min-height:100vh;padding:28px}h1{font-size:22px;margin:0 0 8px}p{color:#dcddda;line-height:1.5}.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:22px 0}.controls button{border:0;border-radius:20px;padding:10px 16px;cursor:pointer}input{accent-color:#e4b83f}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.card{position:relative;text-align:left;border:1px solid #c9cac7;border-radius:8px;background:#f1f1ee;color:#242629;padding:12px;min-height:115px;cursor:pointer;font:inherit}.head{display:flex;align-items:center;gap:10px;font-weight:650}.avatar{display:grid;place-items:center;position:relative;width:32px;height:32px;border-radius:50%;background:#dedfdb}.ring{position:absolute;inset:3px;border:1px solid #777;border-radius:50%;opacity:0}.text{display:block;margin-top:16px;color:#62666a;font-size:14px}.status{min-height:24px;font-size:14px}@media(max-width:500px){main{padding:18px}.card{min-height:100px}}
</style></head><body><main><h1>八人会话 · 提示音试听</h1><p>点击任意成员，试听对应的发言提示音；也可以播放一段模拟对话，与点赞音效比较。</p><div class="controls"><label for="volume">音量 <output id="level">60%</output></label><input id="volume" type="range" min="0" max="100" value="60"><button id="play">▶ 模拟对话</button><button id="like">👍 试听点赞</button></div><div id="status" class="status" role="status">点击成员卡片即可试听</div><div class="grid" id="grid"></div></main><script type="module">
import { createSpeechSound } from '/src/speechSound.ts';
import { createReactionSound } from '/src/reactionSound.ts';
const speech=createSpeechSound(), reaction=createReactionSound(); let volume=60, timer; const grid=document.querySelector('#grid'), status=document.querySelector('#status');
const lines=['大家好，听得到吗？','可以，声音很清楚。','我来分享一下想法。','这个方案不错。','我也同意。','我们继续吧。','稍等，我补充一下。','好的，收到。'];
for(let i=0;i<8;i++){const card=document.createElement('button');card.className='card';card.innerHTML=`<span class="head"><span class="avatar">${i+1}<span class="ring"></span><span class="ring"></span></span>成员 ${i+1}</span><span class="text">点击试听</span>`;card.onclick=async()=>{clearTimeout(timer); await unlock(); trigger(i)};grid.append(card)}
function configure(){speech.configure(volume);reaction.configure({enabled:true,volume})} configure();
function trigger(i){const card=grid.children[i]; card.querySelector('.text').textContent=lines[i]; card.animate([{borderColor:'#e4b83f',offset:.35}],{duration:650,easing:'ease-out'}); [...card.querySelectorAll('.ring')].forEach((ring,j)=>ring.animate([{transform:'scale(.8)',opacity:.55},{transform:'scale(2.4)',opacity:0}],{duration:650,delay:j*90,easing:'ease-out'})); const played=speech.play(i);status.textContent=played?`成员 ${i+1} 发言`: '音频未启用，请再次点击卡片';}
async function unlock(){const result=await Promise.all([speech.unlock(),reaction.unlock()]);return result}
grid.addEventListener('pointerdown',()=>{void unlock()},{capture:true});
document.querySelector('#volume').oninput=e=>{volume=+e.target.value;document.querySelector('#level').value=volume+'%';configure()};
document.querySelector('#play').onclick=async()=>{clearTimeout(timer);await unlock();let i=0;function next(){trigger(i++);if(i<8)timer=setTimeout(next,1100)}next()};
document.querySelector('#like').onclick=async()=>{clearTimeout(timer);const [,ready]=await unlock();status.textContent=ready && await reaction.play('agree')?'点赞音效':'音频未启用，请检查音量或浏览器';};
</script></body></html>

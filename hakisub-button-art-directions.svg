<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000">
<rect width="1200" height="1000" fill="#eeefeb"/>
<g font-family="Microsoft YaHei, PingFang SC, sans-serif">
<text x="56" y="68" font-size="28" font-weight="700" fill="#292d30">HakiSub · 按钮设计探索</text>
<text x="58" y="99" font-size="15" fill="#757b7b">灰白界面中的三种表达 · 图标、文字与留白一起设计</text>
<!-- panels -->
<rect x="48" y="126" width="1104" height="250" rx="24" fill="#fafaf7"/><rect x="48" y="394" width="1104" height="250" rx="24" fill="#fafaf7"/><rect x="48" y="662" width="1104" height="250" rx="24" fill="#fafaf7"/>
<!-- A editorial -->
<text x="82" y="173" font-size="13" fill="#8a908d" letter-spacing="2">DIRECTION 01</text><text x="82" y="212" font-size="23" font-weight="700" fill="#303538">留白与秩序</text><text x="82" y="243" font-size="14" fill="#777d7d">文字左对齐，箭头留在右侧</text><text x="82" y="268" font-size="14" fill="#777d7d">克制、像一本编辑精良的杂志</text>
<rect x="505" y="166" width="276" height="68" rx="14" fill="#41454a"/><text x="528" y="208" font-size="16" font-weight="700" fill="#f5f5f2" letter-spacing="1">创建房间</text><path d="M745 200h15m-6-6 6 6-6 6" fill="none" stroke="#f5f5f2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="805" y="166" width="276" height="68" rx="14" fill="#e6e7e2"/><text x="828" y="208" font-size="16" font-weight="700" fill="#34393b" letter-spacing="1">加入房间</text><path d="M1045 200h15m-6-6 6 6-6 6" fill="none" stroke="#34393b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="505" y="285" font-size="13" fill="#8a908d">主操作</text><text x="805" y="285" font-size="13" fill="#8a908d">次操作</text><text x="505" y="321" font-size="13" fill="#717878">中文 16px / 粗体 / 字距 1px</text>
<!-- B friendly soft -->
<text x="82" y="441" font-size="13" fill="#8a908d" letter-spacing="2">DIRECTION 02</text><text x="82" y="480" font-size="23" font-weight="700" fill="#303538">圆润与节奏</text><text x="82" y="511" font-size="14" fill="#777d7d">图标置于独立圆形，文字居中成组</text><text x="82" y="536" font-size="14" fill="#777d7d">柔和、有亲和力，适合移动端</text>
<rect x="505" y="434" width="276" height="68" rx="34" fill="#41454a"/><circle cx="542" cy="468" r="21" fill="#5d6265"/><path d="M536 468h12m-6-6v12" fill="none" stroke="#f5f5f2" stroke-width="2" stroke-linecap="round"/><text x="653" y="474" text-anchor="middle" font-size="16" font-weight="700" fill="#f5f5f2" letter-spacing=".5">创建房间</text>
<rect x="805" y="434" width="276" height="68" rx="34" fill="#e6e7e2"/><circle cx="842" cy="468" r="21" fill="#d3d6d2"/><path d="M836 468h12m-5-5 5 5-5 5" fill="none" stroke="#41484a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="953" y="474" text-anchor="middle" font-size="16" font-weight="700" fill="#34393b" letter-spacing=".5">加入房间</text>
<text x="505" y="553" font-size="13" fill="#8a908d">主操作</text><text x="805" y="553" font-size="13" fill="#8a908d">次操作</text><text x="505" y="589" font-size="13" fill="#717878">中文 16px / 粗体 / 字距 0.5px</text>
<!-- C typographic -->
<text x="82" y="709" font-size="13" fill="#8a908d" letter-spacing="2">DIRECTION 03</text><text x="82" y="748" font-size="23" font-weight="700" fill="#303538">字形与留声</text><text x="82" y="779" font-size="14" fill="#777d7d">更有性格的衬线中文作为标题</text><text x="82" y="804" font-size="14" fill="#777d7d">小号英文辅助，带一点品牌气质</text>
<rect x="505" y="702" width="276" height="76" rx="12" fill="#41454a"/><text x="530" y="737" font-family="SimSun, Songti SC, serif" font-size="19" font-weight="700" fill="#f5f5f2" letter-spacing="2">创建房间</text><text x="531" y="760" font-family="Arial,sans-serif" font-size="10" fill="#c5c9c5" letter-spacing="2">CREATE A ROOM</text><path d="M744 740h15m-6-6 6 6-6 6" fill="none" stroke="#f5f5f2" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="805" y="702" width="276" height="76" rx="12" fill="#e6e7e2"/><text x="830" y="737" font-family="SimSun, Songti SC, serif" font-size="19" font-weight="700" fill="#34393b" letter-spacing="2">加入房间</text><text x="831" y="760" font-family="Arial,sans-serif" font-size="10" fill="#747b7b" letter-spacing="2">JOIN A ROOM</text><path d="M1044 740h15m-6-6 6 6-6 6" fill="none" stroke="#34393b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="505" y="831" font-size="13" fill="#8a908d">主操作</text><text x="805" y="831" font-size="13" fill="#8a908d">次操作</text><text x="505" y="867" font-size="13" fill="#717878">中文 19px / 宋体示意 / 英文 10px</text>
<text x="58" y="960" font-size="14" fill="#747a7a">概念示意：桌面放大展示。不同设备的中文字体及粗细可能略有差异。</text>
</g></svg>
